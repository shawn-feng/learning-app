# 权益认证中台 Nginx 配置
# 安装位置: /etc/nginx/sites-available/benefit-auth

server {
    listen 80;
    listen [::]:80;
    server_name auth.aixuexihao.top;

    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auth.aixuexihao.top;

    ssl_certificate /etc/letsencrypt/live/aixuexihao.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aixuexihao.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
