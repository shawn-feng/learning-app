# 权益认证中台 Nginx 配置
# 安装位置: /etc/nginx/sites-available/benefit-auth
# 2026-10-10 登录安全加固（ISSUE-174）：限流分区 + 慢连接超时（防 DDoS/CPU 放大/连接耗尽）

# 本文件被 include 进 http 上下文，分区声明写在这里即可（全 nginx 共享、重启不清空）。
limit_req_zone $binary_remote_addr zone=ba-perip:10m rate=20r/s;   # 全站：每 IP 20 r/s
limit_req_zone $binary_remote_addr zone=ba-auth:10m  rate=1r/s;    # 登录/管理：每 IP 1 r/s
limit_conn_zone $binary_remote_addr zone=ba-conn:10m;              # 每 IP 并发连接

server {
    listen 80;
    listen [::]:80;
    server_name auth.aixuexihao.top;

    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auth.aixuexihao.top;

    ssl_certificate /etc/letsencrypt/live/aixuexihao.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aixuexihao.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    # 慢连接防护（slowloris）：10s 内没发完头部/正文即断
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 30s;

    limit_conn ba-conn 20;           # 每 IP 并发连接上限
    limit_req_status 429;            # 超限返回 429（默认 503）
    limit_conn_status 429;

    # 登录/管理类（昂贵端点）：每 IP 1 r/s，burst 5 —— 削掉密码哈希 CPU 放大
    location /api/account/     { limit_req zone=ba-auth burst=5 nodelay; include /etc/nginx/benefit-auth-proxy.conf; }
    location /api/admin-portal/ { limit_req zone=ba-auth burst=5 nodelay; include /etc/nginx/benefit-auth-proxy.conf; }
    location /api/app/         { limit_req zone=ba-auth burst=5 nodelay; include /etc/nginx/benefit-auth-proxy.conf; }

    # 其余 API：每 IP 20 r/s，burst 40
    location /api/             { limit_req zone=ba-perip burst=40 nodelay; include /etc/nginx/benefit-auth-proxy.conf; }

    # 静态资源（登录页二维码等）不限流
    location /static/ {
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $host;
    }

    location / {
        limit_req zone=ba-perip burst=40 nodelay;
        include /etc/nginx/benefit-auth-proxy.conf;
    }
}
