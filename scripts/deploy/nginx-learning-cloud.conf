# 权益认证中台门户（www.aixuexihao.top）
# 路径分流：
#   - 页面(/,/login,/me) + 中台 API(/api/oauth,/api/app,/api/me) → benefit-auth :9001
#   - 学习伙伴 API(/health,/api/version,/api/auth,/api/license,/api/sync) → learning-cloud :8000
# 安装位置: /etc/nginx/sites-available/learning-cloud

# HTTP → HTTPS 跳转
server {
    listen 80;
    listen [::]:80;
    server_name www.aixuexihao.top aixuexihao.top;

    client_max_body_size 100m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站点（门户）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.aixuexihao.top aixuexihao.top;

    ssl_certificate /etc/letsencrypt/live/aixuexihao.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aixuexihao.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100m;

    # ---------- 学习伙伴 API → 8000（Electron App 兼容，保持原路径） ----------
    location ~ ^/(health|api/version|api/auth|api/license|api/sync) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- 门户页面 + 中台 API → 9001（默认） ----------
    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
