name: Build Linux (Ubuntu 24 x64)

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # 项目存在 typescript@7 与 edge-tts 的 peer 冲突，必须 --legacy-peer-deps
        run: npm ci --legacy-peer-deps

      - name: Build (electron-vite + electron-builder --linux)
        run: npm run dist:linux
        # 说明：package.json 的 build.electronDownload.mirror 指向 npmmirror。
        # 海外 runner 拉这个镜像可能偏慢；若 electron 二进制下载超时，
        # 取消下面一行的注释改用官方源：
        # env:
        #   ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-installers
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error
