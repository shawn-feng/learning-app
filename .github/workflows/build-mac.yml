name: Build macOS

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    strategy:
      # x64 与 arm64 分开构建：ffmpeg-static 是带原生二进制的包，
      # 必须让它与 dmg 架构一致（x64 dmg 含 x64 ffmpeg，arm64 dmg 含 arm64 ffmpeg），
      # 否则 Intel Mac 跑到 arm64 ffmpeg 会直接执行失败、语音输入不可用。
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # 项目存在 typescript@7 与 edge-tts 的 peer 冲突，必须 --legacy-peer-deps
        run: npm ci --legacy-peer-deps

      - name: Ensure ffmpeg-static binary matches target arch
        # 关键：ffmpeg-static 的 install.js 在二进制已存在时会直接跳过下载（exit 0），
        # 所以必须先删掉默认按 runner 架构装的旧二进制，再按目标架构 rebuild 才会重新下载正确架构。
        # 只动这一个包，不影响 electron 等其它依赖。
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_arch=${{ matrix.arch }} npm rebuild ffmpeg-static

      - name: Verify ffmpeg-static binary (ground truth)
        run: |
          echo "== ffmpeg-static binary info =="
          ls -l node_modules/ffmpeg-static/ffmpeg
          file node_modules/ffmpeg-static/ffmpeg || true

      - name: Build (electron-vite + electron-builder --mac --${{ matrix.arch }})
        run: npm run dist:mac -- --${{ matrix.arch }}
        env:
          # 海外 runner 用官方源下载 electron 二进制，比 package.json 里的 npmmirror 镜像更快
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          # 不签名（ad-hoc）：无 Developer ID 证书时 electron-builder 自动 fallback ad-hoc 签名
          # 锁部署目标为 10.15，防止 macos-latest (Sequoia 15) 抬高最低系统版本导致旧 Mac 报“不支持此应用”
          MACOSX_DEPLOYMENT_TARGET: "10.15"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: |
            dist/*.dmg
          if-no-files-found: error
