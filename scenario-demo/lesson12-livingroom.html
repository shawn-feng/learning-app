<!--
  ISSUE-061 场景原型：英语第12课 Yellow-Unit1-hello-story
  ================================================
  本页是「场景舞台」：只负责演出。语音/ASR/agent 会话都在 app 壳。

  ── agent 下行指令（宿主经桥下发，或 window.ScenarioAPI 直调）──
  { type:"scene:say",   character:"steve", text:"Hello! I'm Steve.", zh:"你好！我是 Steve。", emotion:"happy" }
  { type:"scene:move",  character:"steve", x:420, duration:2.0 }
    // x=舞台横坐标 10~1120（任意位置），或目标名：
    //   window=站到窗前(≈120) / sofa=沙发前(≈320) / table=茶几旁(≈600) / plant=绿植旁(≈510)
    //   lamp=台灯边(≈760) / tv=电视机前(≈1010) / picture=挂画下(≈500) / rug=地毯中央(≈560)
  { type:"scene:act",   character:"steve", action:"turn-on-lamp" }
    // 动作表：
    //   turn-on-lamp 开台灯 | turn-off-lamp 关台灯 | turn-on-tv 开电视 | turn-off-tv 关电视
    //   open-window 开窗 | close-window 关窗 | sit-sofa 坐到沙发上 | stand 站起
    //   jump 跳 | dance 跳舞 | watch-tv 走到沙发坐下看电视
    //   drink-water 走到茶几旁用杯子喝水 | picture-fall 墙上的画掉下来 | picture-hang 把画挂回去
  { type:"scene:highlight", target:"sofa" }                                        // 高亮某物件/角色
  { type:"scene:update", task:"greet", progress:2, total:3 }                       // 任务进度
    // 场景页没有「结束」：不存在 scene:end，主线任务完成由宿主聊天区（agent 的对话文字）提示，
    // 页面本身永不收尾——孩子想继续，角色就一直陪他演、陪他聊。end 类指令即使到达也一律忽略。

  ── 舞台上行事件（postMessage 给宿主，由 agent 消费）──
  { type:"scene:ready", manifest:{v:1,title,props[],characters[],landmarks{}} }  // 场景就绪时上报一次属性清单（见 SCENARIO-HTML-SPEC）
  { type:"scene:child-click", target:"sofa", word:"sofa", zh:"沙发" }   // 父页面转成通用 click 事件注入 agent
  { type:"scene:mic-press" } / { type:"scene:mic-release" }   // 按住说话（语音由 app 壳处理，v1 父页面忽略）

  TTS：本页直接用标准 window.speechSynthesis.speak(utterance)。
  app 内：注入的桥脚本接管 speechSynthesis → 上抛父级 edge-tts 播报（与聊天同音色链路）→
  page:tts:done 触发 utterance.onend；独立浏览器预览：走浏览器本地 TTS。一条代码路径两处通用。
-->
<style>

  .apple { position:absolute; left:78px; top:-20px; width:26px; height:26px; border-radius:50%;

  #wordcard .zh { font-size:15px; color:#555; margin-top:2px; }

</style>

<script>
(function () {
  "use strict";

  /* ── 缩放适配 ── */
  var stage = document.getElementById("stage");
  function fit() {
    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit); fit();

  var inIframe = window.parent !== window;

  /* ── TTS：统一走标准 speechSynthesis ──
     app 内：桥脚本接管 speechSynthesis，speak 上抛父级 edge-tts 播报（page:tts:done 触发 onend）；
     独立预览：浏览器本地 TTS 直接发声。 */
  function speak(text) {
    try {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = 0.9;
      window.speechSynthesis.speak(u);
    } catch (err) { /* 无声环境忽略 */ }
  }

  /* ── 内部工具 ── */
  function $(id) { return document.getElementById(id); }
  var chars = { steve: $("ch-steve"), maggie: $("ch-maggie") };

  var propPhon = { sofa: "/ˈsəʊfə/", table: "/ˈteɪbl/", lamp: "/ˈlæmp/", "TV": "/ˌtiːˈviː/", window: "/ˈwɪndəʊ/", plant: "/ˈplɑːnt/", cup: "/kʌp/", picture: "/ˈpɪktʃə/" };

  /* 地标：角色可走到场景里任何「有名的地方」，数字 x=10~1120 则可站到任意位置 */
  var standSpots = { window: 120, sofa: 320, table: 600, plant: 510, lamp: 760, tv: 1010, picture: 500, rug: 560 };

  /* 喝水：把茶几上的杯子端到角色嘴边喝一口再放回去 */
  function raiseCupTo(cid, ch) {
    clearTimeout(raiseCupTo._a); clearTimeout(raiseCupTo._b);
    ch.querySelector(".body").style.transform = "scaleX(1)";       // 面向茶几
    var ax = parseFloat(ch.style.left) || 0;
    var topY = 720 - 118 - (ch.offsetHeight || 260);
    var mx = ax + 75 + 26, my = topY + 54;                        // 嘴前坐标（舞台像素）
    var cup = $("p-cup");
    cup.style.left = (mx - 17) + "px";
    cup.style.top = (my - 36) + "px";
    cup.classList.add("drink");
    raiseCupTo._a = setTimeout(function () { cup.classList.remove("drink"); }, 1750);
    raiseCupTo._b = setTimeout(function () { cup.style.left = "606px"; cup.style.top = "476px"; }, 2450);
  }

  function showWordCard(el) {
    var wc = $("wordcard");
    wc.querySelector(".en").textContent = el.dataset.word || "";
    wc.querySelector(".phon").textContent = propPhon[el.dataset.word] || "";
    wc.querySelector(".zh").textContent = el.dataset.zh || "";
    wc.classList.add("show");
    clearTimeout(showWordCard._t);
    showWordCard._t = setTimeout(function () { wc.classList.remove("show"); }, 2600);
  }

  function highlight(el) {
    el.classList.add("glow");
    setTimeout(function () { el.classList.remove("glow"); }, 2200);
  }

  /* ── 场景 API（agent 下行指令在这里落地）── */
  var Scene = {
    say: function (cid, text, zh, emotion) {
      var ch = chars[cid]; if (!ch) return;
      Object.keys(chars).forEach(function (k) { chars[k].classList.remove("speaking"); });
      ch.classList.add("speaking");
      ch.querySelector(".bubble .en").textContent = text;
      ch.querySelector(".bubble .zh").textContent = zh || "";
      var st = $("subtitle");
      st.querySelector(".speaker").textContent = (cid === "steve" ? "Steve:" : "Maggie:");
      st.querySelector(".en").textContent = text;
      st.querySelector(".zh").textContent = zh || "";
      st.classList.add("show");
      speak(text);
      // ISSUE-061：台词自动高亮——提到某个可点物品就让它发光，孩子能顺着找到
      Scene.mentionScan(text);
      Scene.mentionScan(zh);
      clearTimeout(Scene.say._t);
      Scene.say._t = setTimeout(function () {
        ch.classList.remove("speaking");
        st.classList.remove("show");
      }, Math.max(3200, text.length * 260));
    },

    move: function (cid, x, duration, facing) {
      var ch = chars[cid]; if (!ch) return;
      if (typeof x === "string") {                    // 目标名 → 地标 x
        var sx = standSpots[x];
        if (sx == null) return;
        x = sx;
      }
      if (typeof x !== "number") return;
      if (duration) ch.style.transitionDuration = duration + "s";
      var cur = parseFloat(ch.style.left) || 0;
      var dir = (x >= cur) ? 1 : -1;
      ch.querySelector(".body").style.transform = "scaleX(" + (facing || dir) + ")";
      ch.style.left = Math.max(10, Math.min(1120, x)) + "px";
      if (duration) setTimeout(function () { ch.style.transitionDuration = ""; }, duration * 1000);
    },

    act: function (cid, action) {
      var ch = chars[cid]; if (!ch) return;
      switch (action) {
        case "turn-on-lamp":  $("p-lamp").classList.add("on"); $("lamp-light").classList.add("on"); break;
        case "turn-off-lamp": $("p-lamp").classList.remove("on"); $("lamp-light").classList.remove("on"); break;
        case "turn-on-tv":    $("p-tv").classList.add("on"); break;
        case "turn-off-tv":   $("p-tv").classList.remove("on"); break;
        case "open-window":   $("p-window").classList.remove("closed"); break;
        case "close-window":  $("p-window").classList.add("closed"); break;
        case "sit-sofa":      Scene.move(cid, 300, 1.6); setTimeout(function () { ch.classList.add("sit"); }, 1700); break;
        case "stand":         ch.classList.remove("sit"); break;
        case "jump":          ch.classList.remove("jump"); void ch.offsetWidth; ch.classList.add("jump"); break;
        case "dance": {
          ch.classList.remove("sit");
          var sv = ch.querySelector("svg");
          if (sv) { sv.classList.remove("dancing"); void sv.offsetWidth; sv.classList.add("dancing"); }
          clearTimeout(Scene.act._dance);
          Scene.act._dance = setTimeout(function () { if (sv) sv.classList.remove("dancing"); }, 3000);
          break;
        }
        case "watch-tv": // 组合动作：走向沙发坐下 + 打开电视 + 面向电视（agent 可作一条指令下发）
          Scene.move(cid, 285, 1.8);
          setTimeout(function () {
            ch.classList.add("sit");
            ch.querySelector(".body").style.transform = "scaleX(1)";
            $("p-tv").classList.add("on");
            if (cid === "steve") $("p-lamp").classList.add("on"), $("lamp-light").classList.add("on");
          }, 1900);
          break;
        case "picture-fall": {   // 挂画先晃两下再掉下来
          var pic = $("p-picture"); if (!pic) break;
          clearTimeout(Scene.act._pic);
          pic.classList.add("wobble");
          Scene.act._pic = setTimeout(function () { pic.classList.remove("wobble"); pic.classList.add("fallen"); }, 950);
          break;
        }
        case "picture-hang":     // 把画挂回去
          clearTimeout(Scene.act._pic);
          var pic2 = $("p-picture");
          if (pic2) { pic2.classList.remove("wobble", "fallen"); }
          break;
        case "drink-water": {    // 走到茶几旁，用杯子喝水
          ch.classList.remove("sit");
          var sv3 = ch.querySelector("svg");
          if (sv3) sv3.classList.remove("dancing");
          var drinkFrom = standSpots.table;                 // 茶几旁
          var curC = (parseFloat(ch.style.left) || 0) + 75;
          if (Math.abs(curC - drinkFrom) > 220) {
            Scene.move(cid, drinkFrom - 150, 1.7);
            Scene.act._drink = setTimeout(function () { Scene.move(cid, drinkFrom - 150, 0); raiseCupTo(cid, chars[cid]); }, 1900);
          } else {
            Scene.move(cid, drinkFrom - 150, 0);
            raiseCupTo(cid, ch);
          }
          break;
        }
      }
    },

    show: function (cid) {
      var ch = chars[cid]; if (!ch) return;
      ch.classList.remove("hidden"); ch.classList.add("appear");
      setTimeout(function () { ch.classList.remove("appear"); }, 700);
    },

    highlightTarget: function (t) {
      var el = $("p-" + t) || chars[t];
      if (el) { el.classList.add("glow"); setTimeout(function () { el.classList.remove("glow"); }, 2200); }
    },

    // ISSUE-061：扫描台词里提到的物品（id / 英文 / 中文任一命中）→ 自动高亮，帮孩子找到目标。
    // 不依赖 agent 记得发 highlight——作者只需正常写台词。
    mentionScan: function (t) {
      if (!t || !SCENE_MANIFEST || !SCENE_MANIFEST.props) return;
      for (var i = 0; i < SCENE_MANIFEST.props.length; i++) {
        var it = SCENE_MANIFEST.props[i];
        if (!it) continue;
        var words = [it.id, it.word, it.zh];
        for (var w = 0; w < words.length; w++) {
          if (words[w] && t.indexOf(String(words[w])) >= 0) {
            Scene.highlightTarget(it.id);
            break;
          }
        }
      }
    },

    update: function (state) {
      if (!state || state.task !== "greet") return;
      for (var i = 1; i <= (state.total || 3); i++) {
        var d = $("d" + i);
        if (d && i <= state.progress) d.classList.add("done");
      }
    }
  };
  window.ScenarioAPI = Scene;
  window.Scene = Scene;   // 页面无任何手动控制/演示 UI——演出只能由宿主经 scene: 下行指令驱动（此全局导出仅供宿主直调与调试）

  /* ── 下行：接收宿主 / 桥转发的指令 ── */
  window.addEventListener("message", function (e) {
    var d = e.data; if (!d || !d.type || d.type.indexOf("scene:") !== 0) return;
    switch (d.type) {
      case "scene:say":      Scene.say(d.character, d.text, d.zh, d.emotion); break;
      case "scene:move":     Scene.move(d.character, d.x, d.duration, d.facing); break;
      case "scene:act":      Scene.act(d.character, d.act || d.action); break;
      case "scene:show":     Scene.show(d.character); break;
      case "scene:highlight":Scene.highlightTarget(d.target); break;
      case "scene:update":   Scene.update(d.state || { task: d.task, progress: d.progress, total: d.total }); break;
      // scene:end / 其他指令：一律忽略——场景页面没有「结束」，完成由宿主聊天区提示
    }
  });

  function up(msg) { if (inIframe) window.parent.postMessage(msg, "*"); }

  /* ── 上行：孩子点物件 / 角色 → 单词卡 + 发音 + 事件给 agent ── */
  Array.prototype.forEach.call(document.querySelectorAll(".prop"), function (el) {
    el.addEventListener("click", function () {
      showWordCard(el); highlight(el);
      if (el.dataset.word) speak(el.dataset.word);   // 点物品立即读单词（app 内走 edge-tts）
      up({ type: "scene:child-click", target: el.id.replace("p-", ""), word: el.dataset.word, zh: el.dataset.zh });
    });
  });
  Object.keys(chars).forEach(function (cid) {
    chars[cid].addEventListener("click", function () {
      showWordCard(chars[cid]);
      speak(cid === "steve" ? "Steve" : "Maggie");   // 点角色读角色名
      up({ type: "scene:child-click", target: cid, word: cid === "steve" ? "Steve" : "Maggie", zh: cid === "steve" ? "老师 Steve" : "小老鼠 Maggie" });
    });
  });

  /* ── 语音球（UI 占位：真实语音由 app 壳处理，这里只上报）── */
  var orb = $("mic-orb");
  orb.addEventListener("mousedown",  function () { orb.classList.add("pressing"); up({ type: "scene:mic-press" }); });
  orb.addEventListener("mouseup",    function () { orb.classList.remove("pressing"); up({ type: "scene:mic-release" }); });
  orb.addEventListener("touchstart", function (e) { e.preventDefault(); orb.classList.add("pressing"); up({ type: "scene:mic-press" }); }, { passive: false });
  orb.addEventListener("touchend",   function () { orb.classList.remove("pressing"); up({ type: "scene:mic-release" }); });

  /* ── 场景清单（SCENARIO-HTML-SPEC）：可互动物品/角色/地标的属性自述 ──
     可点物品来自 DOM .prop：id(去 p- 前缀)=物品 slug，data-word/data-zh=data-* 必备，
     data-phon 音标可选，data-attr-<名>=可观察属性（如 data-attr-color="black"）。
     角色/地标在此登记。宿主把清单转成一次「场景就绪」事件注入 agent，
     agent 据此回答属性问题、知道该用哪些 move 目标名 / act 动作。 */
  function sceneProps() {
    var arr = [];
    Array.prototype.forEach.call(document.querySelectorAll(".prop"), function (el) {
      var word = el.dataset.word || "";
      var o = { id: el.id.replace("p-", ""), word: word, zh: el.dataset.zh || "" };
      o.phon = el.dataset.phon || propPhon[word] || "";
      var attrs = {};
      Object.keys(el.dataset).forEach(function (k) {
        if (k.indexOf("attr") === 0 && k.length > 4) attrs[k.slice(4).toLowerCase()] = el.dataset[k];
      });
      if (Object.keys(attrs).length) o.attrs = attrs;
      arr.push(o);
    });
    return arr;
  }
  var SCENE_MANIFEST = {
    v: 1,
    title: "客厅 living room",
    props: sceneProps(),
    characters: [
      { id: "steve", name: "Steve", zh: "老师 Steve", persona: "友善的英语老师，常穿蓝衬衫", voice: "male", color: "blue" },
      { id: "maggie", name: "Maggie", zh: "小老鼠 Maggie", persona: "Steve 的学生，活泼爱跳舞", voice: "female" }
    ],
    landmarks: { window: 120, sofa: 320, table: 600, plant: 510, rug: 560, picture: 500, lamp: 760, tv: 1010 }
  };
  window.__PI_SCENE__ = SCENE_MANIFEST;   // 场景页标准：把属性清单暴露给宿主
  if (inIframe) {
    setTimeout(function () { up({ type: "scene:ready", manifest: SCENE_MANIFEST }); }, 400);
  }

})();
</script>
</body>
</html>
