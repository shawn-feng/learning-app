<div id="tip" data-page-node-id="UAVvNaHtRbG0dAjgxR3icg">上方按钮 = 开发预览用的「宿主模拟器」；正式学习资料页没有这些按钮，动作只由孩子 agent 的 scene_command 实时驱动</div>
<div id="log" data-page-node-id="DTAsCvYYeQt7Pov2As7w2E">· 点按钮向下发 scene: 指令观察演出；台词命中物品会自动高亮（mentionScan）；点场景里物品/角色会发声。</div>
<script>
  var frame = document.getElementById("stage");
  function send(msg){ frame.contentWindow.postMessage(msg, "*"); log(JSON.stringify(msg)); }
  function say(c, text, zh){ send({ type:"scene:say", character:c, text:text, zh:zh }); }
  function act(c, a){ send({ type:"scene:act", character:c, act:a }); }
  function move(c, x){ send({ type:"scene:move", character:c, x:x }); }
  function showMaggie(){ send({ type:"scene:show", character:"maggie" }); }
  function hideMaggie(){ send({ type:"scene:hide", character:"maggie" }); }
  function upd(n){ send({ type:"scene:update", state:{ task:"hello", progress:n, total:3 } }); }
  function log(t){ var el=document.getElementById("log"); el.textContent = "· " + t + "\n" + el.textContent; }

  // 宿主模拟：场景内 speak 走 page:tts → 此处用浏览器语音朗读
  window.addEventListener("message", function(e){
    if (e.source !== frame.contentWindow) return;
    if (e.data && e.data.type === "page:tts" && window.speechSynthesis) {
      try {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(String(e.data.text || ""));
        var vs = window.speechSynthesis.getVoices().filter(function(v){ return /^en/i.test(v.lang); });
        u.lang="en-US"; u.rate=0.92; if(vs.length) u.voice=vs[0];
        window.speechSynthesis.speak(u);
      } catch(err){}
    }
  });

  var timers = [];
  function later(fn, ms){ timers.push(setTimeout(fn, ms)); }
  function playScript(){
    timers.forEach(clearTimeout); timers = [];
    // 复位
    act("steve","stand"); act("steve","turn-off-tv"); act("steve","turn-off-lamp");
    act("steve","close-window"); act("steve","picture-hang"); hideMaggie();
    move("steve","window");
    upd(0);
    later(function(){ act("steve","open-window"); say("steve","Look, it is a sunny morning in my living room!","看，我客厅的早晨阳光明媚！"); }, 800);
    later(function(){ act("steve","turn-on-lamp"); act("steve","turn-on-tv"); say("steve","Hello! I am Steve. What is your name?","你好！我是 Steve。你叫什么名字？"); }, 4200);
    later(function(){ showMaggie(); move("maggie","table"); act("maggie","jump"); say("maggie","Hi! I am Maggie.","嗨！我是 Maggie。"); }, 9000);
    later(function(){ say("steve","Hello, Maggie! How are you?","你好，Maggie！你好吗？"); }, 13000);
    later(function(){ say("maggie","I am fine, thank you!","我很好，谢谢！"); upd(1); }, 15800);
    later(function(){ move("steve","sofa"); act("steve","sit-sofa"); say("steve","This is my sofa. Can you say sofa?","这是我的沙发。你会说 sofa 吗？"); }, 18000);
    later(function(){ say("steve","What color is the TV? It is black.","电视是什么颜色？它是黑色的。"); act("steve","stand"); upd(2); }, 21400);
    later(function(){ say("steve","Great job! Do you want to keep playing with me?","太棒了！还想继续跟我玩吗？"); upd(3); }, 25000);
  }
</script>
