# 学习伙伴云端服务 docker-compose
# 启动: docker-compose up -d
# 查看日志: docker-compose logs -f
# 停止: docker-compose down

version: "3.8"

services:
  cloud-api:
    build: .
    container_name: learning-app-cloud
    ports:
      - "8000:8000"
    volumes:
      # 持久化数据库和文件存储
      - ./database:/app/database
      - ./storage:/app/storage
    restart: unless-stopped
    environment:
      - JWT_SECRET=${JWT_SECRET:-learning-app-prod-secret-change-me}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
